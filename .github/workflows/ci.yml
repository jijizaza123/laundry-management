name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 全量测试（7 套，临时库副本，不写真实数据）
        env:
          LAUNDRY_ENV: dev
          LAUNDRY_STAFF_INVITE_CODE: laundry-2026
        run: python tests/run_all.py

      - name: 评估集（桩模式，80 条）
        env:
          LAUNDRY_ENV: dev
          LAUNDRY_STAFF_INVITE_CODE: laundry-2026
        run: python scripts/eval_agent.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t laundry-management:ci .
      - name: 起容器并检查健康检查
        run: |
          docker run -d --name laundry -p 8000:8000 \
            -e LAUNDRY_SECRET_KEY=ci-secret-key-should-be-long-enough-000 \
            -e LAUNDRY_ENV=production \
            laundry-management:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
      - name: 收尾
        if: always()
        run: docker rm -f laundry || true
