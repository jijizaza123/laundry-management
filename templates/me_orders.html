{% extends "base_me.html" %}
{% block title %}我的订单{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1>我的订单</h1>
        <p>洗涤进度、金额、预计取衣时间都在这里</p>
    </div>
    <div class="seg" id="statusFilter">
        <button class="active" data-status="">全部</button>
        <button data-status="received">待洗涤</button>
        <button data-status="washing">洗涤中</button>
        <button data-status="ready">可取衣</button>
        <button data-status="completed">已完成</button>
    </div>
</div>

<div class="card">
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>订单号</th>
                <th>收衣时间</th>
                <th>衣物</th>
                <th>件数</th>
                <th>应收</th>
                <th>已付</th>
                <th>待付</th>
                <th>状态</th>
                <th>预计取衣</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="ordersBody">
            <tr><td colspan="10" class="empty">加载中…</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/js/me_common.js"></script>
<script src="/js/me_orders.js"></script>
{% endblock %}
