<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}我的衣橱{% endblock %} · 洗衣店客户端</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/me.css">
</head>
<body>
<header class="topbar me-topbar">
    <a class="brand" href="/me"><span class="brand-mark">洗</span>我的衣橱</a>
    <nav class="nav" id="nav">
        <a href="/me" data-page="home">我的首页</a>
        <a href="/me/book" data-page="book">线上点单</a>
        <a href="/me/orders" data-page="orders">我的订单</a>
        <a href="/me/messages" data-page="messages">消息<span class="badge badge-dot" id="msgBadge" style="display:none;">0</span></a>
        <a href="/me/chat" data-page="chat">洗衣助手</a>
    </nav>
    <div class="nav-user">
        <span class="avatar" id="avatar">-</span>
        <span id="userName">-</span>
        <button class="btn btn-ghost btn-sm" onclick="meLogout()">退出</button>
    </div>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<div class="toast-host" id="toastHost"></div>
{% block modal %}{% endblock %}

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
